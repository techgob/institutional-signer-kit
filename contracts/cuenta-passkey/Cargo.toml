[package]
name = "cuenta-passkey"
version = "0.0.0"
edition = "2021"
publish = false

# Cuenta de contrato con passkey (prueba de rotación). Se compila solo, fuera de cualquier workspace.
[workspace]

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27"

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
