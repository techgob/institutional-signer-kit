<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Recorrido de los ocho hitos del ciclo del presupuesto participativo con la evidencia real del Institutional Signer Kit: guardas, inconsistencias detectadas y transacciones en Stellar testnet.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#392639">
<meta property="og:type" content="website">
<meta property="og:title" content="Registro Verificable del Presupuesto Participativo">
<meta property="og:description" content="Catorce transiciones legales, ocho hitos, y la evidencia real en testnet del Institutional Signer Kit.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Registro Verificable del Presupuesto Participativo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: página de una columna sin tarjetas — la estructura se marca con filetes horizontales lavanda,
   los hitos avanzan por un riel superior, y los datos van en mono blanco sobre ciruela. */
:root{
  /* Línea gráfica TechGob · enfoque blockchain */
  --ciruela:#392639;
  --ciruela-alta:#422C42;
  --lavanda:#C2BAFF;
  --lima:#EDFFA3;
  --lima-suave:#DCE39A;
  --dato:#FFFFFF;
  --filete:#8175A2;
  --filete-fino:#6E6086;
  --atenuado:#A79DCB;
  /* Estados semánticos, desplazados hacia la paleta para no competir con ella */
  --ok:#EDFFA3;
  --alerta:#F2C86B;
  --bloqueo:#FF8E82;
  --pendiente:#A79DCB;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ciruela);color:var(--lima-suave);
  font-family:var(--sans);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 60px}

h1,h2,h3,h4{font-family:var(--mono);font-weight:300;color:var(--lavanda);letter-spacing:-.005em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4.4vw,2.5rem);line-height:1.14}
h2{font-size:clamp(1.12rem,2.7vw,1.45rem)}
h3{font-size:1rem;font-weight:400}
h4{font-size:.95rem;font-weight:400}
p{margin:0}
strong{color:var(--dato);font-weight:500}
a{color:var(--lima);text-decoration:none;border-bottom:1px solid rgba(237,255,163,.34)}
a:hover{border-bottom-color:var(--lima)}
:focus-visible{outline:2px solid var(--lima);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dato)}

.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lavanda);font-weight:400}
.eyebrow::before{content:"+ ";color:var(--filete)}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ciruela);border-bottom:1px solid var(--filete-fino)}
.topbar-progress{height:2px;background:rgba(129,117,162,.3)}
.topbar-progress span{display:block;height:100%;background:var(--lima);transition:width .35s ease}
.topbar-inner{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-family:var(--mono);font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--lavanda);border:1px solid var(--filete);padding:3px 8px;white-space:nowrap}
.topbar-title{font-family:var(--mono);font-size:.8rem;color:var(--atenuado);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--filete)}
.seg button{font-family:var(--mono);font-size:.74rem;padding:4px 10px;border:0;background:transparent;color:var(--atenuado);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lavanda);color:var(--ciruela)}
.step-count{font-family:var(--mono);font-size:.76rem;color:var(--atenuado);font-variant-numeric:tabular-nums}

/* ---------- hero ---------- */
.hero{position:relative;padding-block:38px 24px;border-bottom:1px solid var(--filete)}
.hero::before{
  content:"";position:absolute;inset:0 0 24px 0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(194,186,255,.16) 0 1px,transparent 1px 9px);
  -webkit-mask-image:radial-gradient(120% 80% at 88% 10%,#000 0%,transparent 72%);
  mask-image:radial-gradient(120% 80% at 88% 10%,#000 0%,transparent 72%);
}
.hero>*{position:relative}
.codetag{position:absolute;top:0;right:0;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--filete)}
.hero-sub{color:var(--lima-suave);max-width:64ch;margin-top:14px}
.hero-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.callout{border-left:2px solid var(--lima);padding:4px 0 4px 14px;margin-top:24px;max-width:78ch}
.callout h3{font-size:.9rem;color:var(--lima)}
.callout h3::before{content:"> ";color:var(--filete)}
.callout p{font-size:.88rem;color:var(--atenuado);margin-top:6px}

/* ---------- etiquetas de estado: contorno, nunca relleno ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.69rem;letter-spacing:.04em;padding:3px 8px;border:1px solid var(--filete-fino);color:var(--atenuado);background:transparent;white-space:nowrap}
.b-ok{border-color:rgba(237,255,163,.5);color:var(--ok)}
.b-ok::before{content:"✓"}
.b-warn{border-color:rgba(242,200,107,.5);color:var(--alerta)}
.b-warn::before{content:"!"}
.b-block{border-color:rgba(255,142,130,.55);color:var(--bloqueo)}
.b-block::before{content:"✕"}
.b-pend{border-color:var(--filete-fino);color:var(--pendiente)}
.b-pend::before{content:"·"}
.b-soft{border-color:var(--filete-fino);color:var(--atenuado)}

/* ---------- secciones ---------- */
section{padding-block:38px;border-bottom:1px solid var(--filete)}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sec-note{color:var(--lima-suave);font-size:.9rem;max-width:74ch;margin-top:10px}

/* ---------- riel de hitos ---------- */
.rail{display:flex;gap:0;overflow-x:auto;padding-block:20px 0;scrollbar-width:thin;border-bottom:1px solid var(--filete-fino)}
.rail button{flex:0 0 auto;min-width:118px;text-align:left;background:transparent;border:0;border-top:2px solid var(--filete-fino);padding:9px 14px 11px 0;margin-right:14px;cursor:pointer;color:var(--atenuado);font-family:var(--mono);transition:border-color .18s,color .18s}
.rail button:hover{border-top-color:var(--lavanda);color:var(--lavanda)}
.rail button[aria-current="true"]{border-top-color:var(--lima);color:var(--lima)}
.rail button small{display:block;font-size:.63rem;letter-spacing:.11em;color:var(--filete)}
.rail button strong{display:block;font-size:.8rem;font-weight:400;margin-top:3px;color:inherit}

/* ---------- panel del hito ---------- */
.panel{display:grid;grid-template-columns:1fr;gap:26px;margin-top:24px}
@media (min-width:780px){.panel{grid-template-columns:1.1fr .9fr;gap:34px}}
.card{min-width:0}
.card-head{padding-bottom:12px;border-bottom:1px solid var(--filete-fino);display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.card-body{padding-top:14px;display:flex;flex-direction:column;gap:16px}
.dl{display:flex;flex-direction:column}
.dl-row{display:grid;grid-template-columns:1fr;gap:2px;padding-block:9px;border-bottom:1px solid rgba(110,96,134,.5)}
@media (min-width:520px){.dl-row{grid-template-columns:152px 1fr;gap:14px;align-items:start}}
.dl-row:last-child{border-bottom:0}
.dl-row dt{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--lavanda);padding-top:3px}
.dl-row dd{margin:0;font-size:.89rem;min-width:0;color:var(--lima-suave)}
.trans{display:flex;flex-direction:column;gap:9px}
.trans-item{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.tcode{font-family:var(--mono);font-size:.69rem;color:var(--lima);border:1px solid rgba(237,255,163,.4);padding:1px 6px;flex:0 0 auto;margin-top:2px;font-variant-numeric:tabular-nums}
.guard{border-left:2px solid var(--filete);padding:2px 0 2px 13px}
.guard b{font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;color:var(--lavanda);display:block;font-weight:400}
.guard b::before{content:"> ";color:var(--filete)}
.guard span{display:block;font-size:.85rem;color:var(--atenuado);margin-top:4px}
.inc{border-top:1px solid rgba(110,96,134,.55);padding-top:10px}
.inc-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.inc-code{font-family:var(--mono);font-size:.74rem;color:var(--dato)}
.inc p{font-size:.84rem;color:var(--lima-suave);margin-top:6px}
.inc em{font-style:normal;font-family:var(--mono);font-size:.69rem;color:var(--filete);display:block;margin-top:5px}
.stack{display:flex;flex-direction:column;gap:13px}
.row-chips{display:flex;gap:6px;flex-wrap:wrap}
.hash{font-family:var(--mono);font-size:.73rem;border:1px solid var(--filete-fino);padding:7px 9px;overflow-x:auto;white-space:nowrap;color:var(--dato)}
.navbtns{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.btn{font-family:var(--mono);font-size:.78rem;padding:7px 14px;border:1px solid var(--filete);background:transparent;color:var(--lavanda);cursor:pointer}
.btn:hover{border-color:var(--lavanda)}
.btn-primary{border-color:var(--lima);color:var(--lima)}
.btn-primary:hover{background:var(--lima);color:var(--ciruela)}
.btn[disabled]{opacity:.35;cursor:default}
.btn[disabled]:hover{border-color:var(--filete);background:transparent;color:var(--lavanda)}

/* ---------- piezas y protección de datos ---------- */
.pieces{display:grid;grid-template-columns:1fr;gap:0;margin-top:22px}
@media (min-width:660px){.pieces{grid-template-columns:1fr 1fr;column-gap:34px}}
.piece{border-top:1px solid var(--filete-fino);padding-block:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.piece h3{font-size:.95rem}
.piece p{font-size:.85rem;color:var(--atenuado)}

/* ---------- tabla ---------- */
.tbl-wrap{overflow-x:auto;margin-top:22px;border-top:1px solid var(--filete)}
table{border-collapse:collapse;width:100%;font-size:.83rem;min-width:700px}
th,td{text-align:left;padding:10px 14px 10px 0;border-bottom:1px solid rgba(110,96,134,.5);vertical-align:top}
th{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--lavanda);font-weight:400;background:var(--ciruela);position:sticky;top:0}
td{color:var(--lima-suave)}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dato)}
td a{font-family:var(--mono);font-size:.78rem}

/* ---------- verificador ---------- */
.checks{display:flex;flex-direction:column;gap:0;margin-top:22px}
.check{border-top:1px solid var(--filete-fino);padding-block:14px;display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.check{grid-template-columns:26px 1fr auto;align-items:start;gap:14px}}
.check-mark{font-family:var(--mono);font-size:1rem;line-height:1.3}
.check h4{font-size:.93rem}
.check p{font-size:.84rem;color:var(--atenuado);margin-top:4px;max-width:72ch}
.check-side{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
@media (min-width:640px){.check-side{align-items:flex-end}}

/* ---------- matriz G10 ---------- */
.matrix{margin-top:22px;border-top:1px solid var(--filete)}
.crit{display:grid;grid-template-columns:1fr;gap:7px;padding-block:9px;border-bottom:1px solid rgba(110,96,134,.45)}
@media (min-width:600px){.crit{grid-template-columns:1fr auto;align-items:center;gap:16px}}
.crit-name{font-size:.87rem;min-width:0;color:var(--lima-suave)}
.crit-name small{display:block;font-family:var(--mono);font-size:.65rem;color:var(--filete);letter-spacing:.05em}
.vals{display:flex;gap:6px;flex-wrap:wrap}
.vals button{font-family:var(--mono);font-size:.78rem;min-width:34px;padding:4px 8px;border:1px solid var(--filete-fino);background:transparent;color:var(--atenuado);cursor:pointer;font-variant-numeric:tabular-nums}
.vals button:hover{border-color:var(--lavanda);color:var(--lavanda)}
.vals button[aria-pressed="true"]{border-color:var(--lima);color:var(--lima)}
.score{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--filete)}
.score-num{font-family:var(--mono);font-size:2.4rem;font-weight:300;line-height:1;color:var(--lima);font-variant-numeric:tabular-nums}
.score small{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--lavanda);display:block;margin-top:6px}
.score-bar{flex:1 1 180px;min-width:120px;height:3px;background:rgba(129,117,162,.4)}
.score-bar span{display:block;height:100%;background:var(--lima);transition:width .2s ease}
.score .mono{color:var(--atenuado);font-size:.78rem}

/* ---------- footer ---------- */
footer{padding-block:34px;color:var(--atenuado);font-size:.83rem;display:flex;flex-direction:column;gap:14px;max-width:80ch}
.foot-marks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mark{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;border:1px solid var(--filete-fino);padding:5px 10px;color:var(--lavanda)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-progress"><span id="prog" style="width:12.5%"></span></div>
  <div class="topbar-inner">
    <div class="topbar-left">
      <span class="brand">TechGob · ISK</span>
      <p class="topbar-title" id="tbTitle"></p>
    </div>
    <div class="topbar-right">
      <span class="step-count" id="stepCount">1/8</span>
      <span class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" id="langEs" aria-pressed="true">ES</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </span>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="hero">
    <span class="codetag">&lt;/techgob&gt;</span>
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroTitle"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="hero-meta" id="heroMeta"></div>
    <div class="callout">
      <h3 id="calloutTitle"></h3>
      <p id="calloutBody"></p>
    </div>
  </div>

  <section id="secRecorrido">
    <div class="sec-head"><p class="eyebrow" id="l_recorrido_eyebrow"></p></div>
    <h2 id="l_recorrido_title"></h2>
    <p class="sec-note" id="l_recorrido_note"></p>
    <div class="rail" id="rail" role="tablist" aria-label="Hitos"></div>
    <div class="panel">
      <div class="card">
        <div class="card-head">
          <div style="min-width:0">
            <p class="eyebrow" id="hitoKicker"></p>
            <h3 id="hitoTitle"></h3>
          </div>
          <span class="badge b-soft mono" id="hitoPhase"></span>
        </div>
        <div class="card-body">
          <p id="hitoDesc" style="font-size:.92rem;color:var(--muted)"></p>
          <div class="trans" id="hitoTrans"></div>
          <dl class="dl" id="hitoDl"></dl>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><p class="eyebrow" id="l_evidencia"></p></div>
        <div class="card-body">
          <div class="stack" id="hitoGuards"></div>
          <div>
            <p class="eyebrow" id="l_estado_impl" style="margin-bottom:7px"></p>
            <div class="row-chips" id="hitoStatus"></div>
          </div>
          <div>
            <p class="eyebrow" id="l_inc_reales" style="margin-bottom:7px"></p>
            <div class="stack" id="hitoIncs"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="navbtns">
      <button class="btn" type="button" id="btnPrev"></button>
      <button class="btn btn-primary" type="button" id="btnNext"></button>
    </div>
  </section>

  <section id="secPiezas">
    <div class="sec-head"><p class="eyebrow" id="l_piezas_eyebrow"></p></div>
    <h2 id="l_piezas_title"></h2>
    <p class="sec-note" id="l_piezas_note"></p>
    <div class="pieces" id="pieces"></div>
  </section>

  <section id="secVerificador">
    <div class="sec-head"><p class="eyebrow" id="l_verif_eyebrow"></p></div>
    <h2 id="l_verif_title"></h2>
    <p class="sec-note" id="l_verif_note"></p>
    <div class="checks" id="checksDoc"></div>
    <p class="sec-note" id="l_conf_note" style="margin-top:22px"></p>
    <div class="checks" id="checksConf"></div>
  </section>

  <section id="secRed">
    <div class="sec-head"><p class="eyebrow" id="l_red_eyebrow"></p></div>
    <h2 id="l_red_title"></h2>
    <p class="sec-note" id="l_red_note"></p>
    <div class="tbl-wrap">
      <table>
        <thead><tr id="txHead"></tr></thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
    <p class="sec-note" id="l_red_foot"></p>
  </section>

  <section id="secMatriz">
    <div class="sec-head"><p class="eyebrow" id="l_mat_eyebrow"></p></div>
    <h2 id="l_mat_title"></h2>
    <p class="sec-note" id="l_mat_note"></p>
    <div class="matrix">
      <div id="crits"></div>
      <div class="score">
        <div><span class="score-num" id="scoreNum">13</span><small id="l_score_label"></small></div>
        <div class="score-bar"><span id="scoreBar" style="width:0%"></span></div>
        <div><span class="mono" id="scoreRange"></span></div>
      </div>
    </div>
    <div class="stack" id="matNotes" style="margin-top:14px"></div>
  </section>

  <section id="secDatos">
    <div class="sec-head"><p class="eyebrow" id="l_dp_eyebrow"></p></div>
    <h2 id="l_dp_title"></h2>
    <p class="sec-note" id="l_dp_note"></p>
    <div class="pieces" id="dpList"></div>
  </section>

  <footer>
    <p id="footText"></p>
    <p id="footMethod" style="font-size:.78rem"></p>
    <div class="foot-marks">
      <span class="mark">TechGob SpA · Chile</span>
      <span class="mark">Apache-2.0</span>
      <span class="mark">Stellar Testnet</span>
    </div>
  </footer>
</div>

<script>

    ciclo:"2210 : 001-2026-MPT : 2027",

    incs:["INC-01","INC-02","INC-03","INC-11","INC-12","INC-15","INC-16"],

  {
    rail:{es:"Convocatoria",en:"Call"}, codes:"T2 · T3",
    phase:{es:"Preparación",en:"Preparation"},
    title:{es:"La convocatoria define quién puede participar",en:"The public call defines who may take part"},
    desc:{es:"La alcaldía convoca como presidencia del consejo de coordinación local y planeamiento cierra el libro de registro de agentes. Solo se ancla la huella de la lista pública de organizaciones: ningún dato personal entra a la cadena.",

var GUARDS = {
  G1:{es:["G1 · Ciclo abierto","Impide cualquier transición sin un ciclo abierto previamente. Sin norma que convoque el proceso, ningún acto posterior tiene sustento."],
      en:["G1 · Open cycle","Blocks any transition without a previously opened cycle. With no ordinance convening the process, no later act has grounding."]},
  G2:{es:["G2 · Clave única","Impide abrir dos veces el mismo ciclo. La clave combina código territorial, número de norma y año fiscal: dos municipalidades emiten normas con el mismo número el mismo año."],
      en:["G2 · Unique key","Prevents opening the same cycle twice. The key combines territorial code, ordinance number and fiscal year: two municipalities issue ordinances with the same number in the same year."]},
  G6:{es:["G6 · Doble sello de tiempo","Impide confiar en la fecha declarada. El contrato compara la fecha del acto con la marca de tiempo del ledger y marca el registro como retroactivo cuando corresponde."],
      en:["G6 · Dual timestamp","Stops the declared date from being trusted. The contract compares the act's date with the ledger timestamp and flags the record as retroactive where applicable."]},
  G7:{es:["G7 · Actos previos a la vigencia","Emite alerta y acepta la transición: el registro documenta hechos, no dictamina su legalidad. Rechazar rompería la completitud de la serie."],
      en:["G7 · Acts before entry into force","Raises an alert and accepts the transition: the registry documents facts, it does not rule on their legality. Rejecting would break the completeness of the series."]},
  G8:{es:["G8 · Claves incompatibles","Impide que una misma clave represente al comité de vigilancia y al consejo de coordinación local. El cargo en el comité es incompatible con la representación ante el consejo."],
      en:["G8 · Incompatible keys","Prevents one key from representing both the oversight committee and the local coordination council. Committee office is incompatible with representing the council."]},
  G9:{es:["G9 · Quórum del comité","Impide firmar sin el quórum del comité. Cuatro miembros, umbral de tres mientras no se conozca su reglamento interno."],
      en:["G9 · Committee quorum","Prevents signing without committee quorum. Four members, threshold of three while its internal rules remain unknown."]},
  G10:{es:["G10 · Puntaje verificable","Impide puntajes inválidos o sustituciones fuera de la escala. El contrato recalcula la suma del vector de criterios y exige que la sustitución elija al alternativo de mayor rango disponible."],
       en:["G10 · Verifiable score","Blocks invalid scores or substitutions outside the scale. The contract recomputes the criteria-vector sum and requires substitution to pick the highest-ranked available alternate."]},
  G11:{es:["G11 · Código único obligatorio","Impide incorporar al presupuesto sin código único de inversiones. Sin ese código la inversión no existe para el sistema de programación multianual."],
       en:["G11 · Investment code required","Blocks budget incorporation without an investment code. Without it the investment does not exist for the multiannual programming system."]},
  G12:{es:["G12 · Rendición cruzada","Impide cerrar un ciclo sin que el siguiente esté abierto. La rendición de cuentas ocurre dentro del proceso participativo del año siguiente."],
       en:["G12 · Cross-cycle accountability","Prevents closing a cycle unless the next one is open. Accountability reporting happens inside the following year's participatory process."]},
  MIN:{es:["Minimización de datos","La prueba de integridad viaja en la cadena; identidades y documentos completos permanecen bajo custodia municipal. El esquema rechaza campos cuyo nombre sugiera datos personales."],
       en:["Data minimization","The integrity proof travels on chain; identities and full documents stay in municipal custody. The schema rejects fields whose names suggest personal data."]},
  R:{es:["R1–R7 · Reglas de la sustitución","Siete condiciones simultáneas: proyecto saliente incorporado, acto motivador anclado, entrante en la lista alternativa respetando la escala, firma de la alcaldía, aviso al consejo y al comité, nota modificatoria presupuestal, e índice de serie consecutivo sin saltos."],
     en:["R1–R7 · Substitution rules","Seven simultaneous conditions: outgoing project incorporated, motivating act anchored, incoming project on the alternate list respecting the scale, mayoral signature, notice to council and committee, budget amendment note, and a consecutive series index with no gaps."]}

    var res = '<span class="badge ' + (x.ok ? "b-ok" : "b-block") + '">' + esc(x.ok ? t("exito") : t("rechazada")) + "</span>";
    if (x.err) res += '<div class="mono" style="font-size:.7rem;color:var(--muted);margin-top:4px">' + esc(x.err) + "</div>";
    if (x.conf) res += '<div style="margin-top:4px"><span class="badge ' + (x.conf === "conforme" ? "b-ok" : "b-pend")
      + '">' + esc(x.conf === "conforme" ? t("conforme") : t("noConforme")) + "</span></div>";
    return "<tr><td class=\"num\">" + esc(x.run) + "</td><td class=\"num\">" + esc(x.step) + "</td><td>" + esc(x[L])
      + '</td><td class="num">' + (x.ledger === null ? '<span class="badge b-pend">' + esc(t("sinDato")) + "</span>" : fmt(x.ledger))
      + '</td><td class="num">' + (x.fee === null ? '<span class="badge b-pend">' + esc(t("sinDato")) + "</span>" : fmt(x.fee) + " stroops")
      + "</td><td>" + res + '</td><td><a href="' + EXPERT + x.hash + '" target="_blank" rel="noopener">'
      + esc(shortHash(x.hash)) + " ↗</a></td></tr>";
  }).join("");
}

function renderMatrix(){
  el("crits").innerHTML = CRITERIOS.map(function(k, i){
    return '<div class="crit"><div class="crit-name">' + esc(k[L]) + "<small>" + esc(k.c) + "</small></div>"
      + '<div class="vals" role="group">' + k.v.map(function(v){
          return '<button type="button" data-k="' + i + '" data-v="' + v + '" aria-pressed="'
            + (scores[i] === v) + '">' + v + "</button>";
        }).join("") + "</div></div>";
  }).join("");
  renderScore();
}

function renderScore(){
  var total = scores.reduce(function(a, b){ return a + b; }, 0);
  el("scoreNum").textContent = total;
  el("scoreBar").style.width = ((total - 13) / (71 - 13) * 100) + "%";
  var notes = [];
  if (total === 71) notes.push(L === "es"
    ? ["Puntaje máximo de la escala.","Los trece criterios en su valor más alto suman 71. El contrato rechazaría cualquier total mayor."]
    : ["Top of the scale.","All thirteen criteria at their highest value sum to 71. The contract would reject any higher total."]);
  if (total === 13) notes.push(L === "es"
    ? ["Puntaje mínimo de la escala.","Trece criterios en su valor mínimo suman 13. Un total menor sería inválido."]
    : ["Bottom of the scale.","Thirteen criteria at their minimum value sum to 13. Any lower total would be invalid."]);
  notes.push(L === "es"
    ? ["Criterio base excluyente · relacion_pdc","La relación con el Plan de Desarrollo Concertado no suma puntos: si no se cumple, excluye el proyecto antes de que el puntaje importe."]
    : ["Exclusionary base criterion · relacion_pdc","Alignment with the Concerted Development Plan adds no points: fail it and the project is excluded before the score matters."]);
  notes.push(L === "es"
    ? ["INC-09 · la matriz no define regla de desempate","Si dos alternativos empatan, elegir al segundo exige motivo anclado y firma del comité. Es un límite conocido de la norma, no del contrato."]
    : ["INC-09 · the matrix defines no tie-break rule","If two alternates tie, choosing the second requires an anchored justification and the committee's signature. This is a known limit of the ordinance, not of the contract."]);
  notes.push(L === "es"
    ? ["INC-13 · un criterio sin puntaje","El criterio sostenibilidad aparece en la matriz sin valores asignados y no figura en el Anexo 2, así que queda fuera del recálculo."]
    : ["INC-13 · one criterion without a score","The sustainability criterion appears in the matrix with no assigned values and is absent from Annex 2, so it stays out of the recomputation."]);
  el("matNotes").innerHTML = notes.map(function(n){
    return '<div class="guard"><b>' + esc(n[0]) + "</b><span>" + esc(n[1]) + "</span></div>";
  }).join("");
}

function renderDp(){
  el("dpList").innerHTML = DP.map(function(d){
    return '<div class="piece"><h3>' + esc(d[L][0]) + "</h3><p>" + esc(d[L][1]) + "</p></div>";
  }).join("");
}

function renderAll(){
  renderStatic();
  renderRail();
  renderHito();
  renderPiezas();
  renderChecks();
  renderTxs();
  renderMatrix();
  renderDp();
}

/* ---------- eventos ---------- */
el("rail").addEventListener("click", function(e){
  var b = e.target.closest("[data-i]");
  if (!b) return;
  cur = Number(b.dataset.i);
  renderHito();
});
el("btnPrev").addEventListener("click", function(){
  if (cur > 0) { cur--; renderHito(); }
});
el("btnNext").addEventListener("click", function(){
  if (cur < HITOS.length - 1) { cur++; renderHito(); }
});
el("crits").addEventListener("click", function(e){
  var b = e.target.closest("[data-k]");
  if (!b) return;
  scores[Number(b.dataset.k)] = Number(b.dataset.v);
  renderMatrix();
});
function setLang(lang){
  L = lang;
  el("langEs").setAttribute("aria-pressed", String(lang === "es"));
  el("langEn").setAttribute("aria-pressed", String(lang === "en"));
  renderAll();
}
el("langEs").addEventListener("click", function(){ setLang("es"); });
el("langEn").addEventListener("click", function(){ setLang("en"); });

renderAll();
</script>
</body>
</html>
